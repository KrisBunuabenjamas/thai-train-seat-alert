name: Check train seats

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run checks only; initialize once; test-discord sends a test; check monitors'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - initialize
          - test-discord
          - check

permissions:
  contents: read

concurrency:
  group: train-seat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Run selected mode
        env:
          MODE: ${{ inputs.mode || 'check' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python -m train_alert --mode "$MODE" --store github
      - name: Report failure
        if: failure()
        run: echo 'Monitor failed. Check logs; do not interpret a failed check as FULL or AVAILABLE.' >> "$GITHUB_STEP_SUMMARY"
